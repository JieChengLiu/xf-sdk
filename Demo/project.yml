# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen
name: XfDemo
options:
  bundleIdPrefix: com.xfusion.sdk
  deploymentTarget:
    iOS: "15.0"

packages:
  # 上一级目录就是 SDK 的 Swift Package
  XfSDK:
    path: ..

targets:
  XfDemo:
    type: application
    platform: iOS
    sources: [XfDemo]
    dependencies:
      - package: XfSDK
        product: XfCore
    info:
      path: XfDemo/Info.plist
      properties:
        CFBundleDisplayName: XF SDK Demo
        NSMicrophoneUsageDescription: 测试语音翻译时需要录音
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # 免费 Apple ID 签名时 Bundle ID 要全局唯一，冲突就改成自己的
        PRODUCT_BUNDLE_IDENTIFIER: com.xfusion.sdk.demo
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
